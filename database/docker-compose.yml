services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: campusiq-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: campusiq
      POSTGRES_USER: campusiq_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - campusiq_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusiq_user -d campusiq"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  campusiq_postgres_data: